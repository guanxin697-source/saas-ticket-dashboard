<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>西津野渡 · 售票数据大屏</title>
<style>
  :root{
    --color-scheme:dark;
    --bg:#070b14; --bg2:#0c1322; --panel:rgba(255,255,255,.04);
    --panel-strong:rgba(255,255,255,.07); --border:rgba(255,255,255,.10);
    --text:#eaf2ff; --muted:#8da2c0; --muted2:#5d6f8c;
    --accent:#19e3a5; --accent2:#28c0ff; --gold:#ffd479;
    --grad:linear-gradient(135deg,var(--accent),var(--accent2));
    --grad-soft:linear-gradient(135deg,rgba(25,227,165,.18),rgba(40,192,255,.18));
    --shadow:0 18px 50px -20px rgba(0,0,0,.6);
    --radius:18px;
  }
  :root[data-theme="light"]{
    --color-scheme:light;
    --bg:#eef3fb; --bg2:#e3ebf7; --panel:rgba(255,255,255,.72);
    --panel-strong:rgba(255,255,255,.9); --border:rgba(15,40,80,.10);
    --text:#0e1c33; --muted:#4a607e; --muted2:#8295b3;
    --accent:#0bbf86; --accent2:#1f9fe0; --gold:#d99315;
    --grad:linear-gradient(135deg,var(--accent),var(--accent2));
    --grad-soft:linear-gradient(135deg,rgba(11,191,134,.14),rgba(31,159,224,.14));
    --shadow:0 18px 50px -24px rgba(20,50,90,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--text); overflow-x:hidden;
    -webkit-font-smoothing:antialiased; transition:background .5s, color .5s;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(60vw 60vw at 12% -10%, rgba(25,227,165,.16), transparent 60%),
      radial-gradient(50vw 50vw at 100% 0%, rgba(40,192,255,.14), transparent 55%),
      radial-gradient(50vw 50vw at 80% 110%, rgba(255,212,121,.10), transparent 60%);
    transition:opacity .5s;
  }
  .hidden{display:none !important;}

  /* ---------- Login / Merchant ---------- */
  .login-wrap{position:relative; z-index:1; min-height:100vh; display:grid; place-items:center; padding:24px;}
  .login-card{
    width:min(440px,100%); padding:36px 32px; border-radius:22px;
    background:var(--panel-strong); border:1px solid var(--border);
    box-shadow:var(--shadow); backdrop-filter:blur(24px);
    animation:pop .6s cubic-bezier(.16,1,.3,1);
  }
  @keyframes pop{from{opacity:0;transform:translateY(18px) scale(.98);}to{opacity:1;transform:none;}}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:18px;}
  .brand .logo{width:42px;height:42px;border-radius:12px;background:var(--grad);display:grid;place-items:center;font-size:22px;box-shadow:0 8px 24px -8px var(--accent);}
  .brand h1{font-size:20px;margin:0;letter-spacing:.5px;}
  .brand p{margin:2px 0 0;font-size:12px;color:var(--muted);}
  .tabs{display:flex;gap:8px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:4px;margin-bottom:16px;}
  .tabs .tab{flex:1;padding:9px;border:none;border-radius:9px;cursor:pointer;background:transparent;color:var(--muted);font-size:14px;font-weight:600;transition:.2s;}
  .tabs .tab.active{background:var(--grad);color:#04121a;box-shadow:0 6px 16px -8px var(--accent);}
  .field{margin-top:12px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  .field input{
    width:100%; padding:13px 14px; border-radius:12px; font-size:14px;
    background:var(--panel); border:1px solid var(--border); color:var(--text);
    outline:none; transition:border .2s, box-shadow .2s;
  }
  .field input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--grad-soft);}
  .field input::placeholder{color:var(--muted2);}
  .remember{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none;}
  .remember input{width:16px;height:16px;accent-color:var(--accent);}
  .btn{
    width:100%; margin-top:18px; padding:13px; border:none; border-radius:12px; cursor:pointer;
    background:var(--grad); color:#04121a; font-size:15px; font-weight:700; letter-spacing:2px;
    transition:transform .15s, filter .2s; box-shadow:0 12px 30px -12px var(--accent);
  }
  .btn:hover{filter:brightness(1.06);} .btn:active{transform:scale(.98);}
  .btn[disabled]{opacity:.6;cursor:wait;}
  .login-hint{margin-top:14px;font-size:12px;color:var(--muted2);line-height:1.6;}
  .login-err{margin-top:12px;font-size:13px;color:#ff7a7a;min-height:18px;white-space:pre-wrap;word-break:break-all;}

  .merchant-list{display:flex;flex-direction:column;gap:10px;margin-top:8px;}
  .merchant-list .m{
    text-align:left;padding:14px 16px;border-radius:13px;cursor:pointer;font-size:14px;font-weight:600;
    background:var(--panel);border:1px solid var(--border);color:var(--text);transition:.2s;
  }
  .merchant-list .m:hover{background:var(--grad-soft);border-color:var(--accent);transform:translateX(3px);}
  .merchant-list .m small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:3px;}

  /* ---------- Dashboard ---------- */
  .dash{position:relative; z-index:1; max-width:1480px; margin:0 auto; padding:22px 26px 50px;}
  .topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:18px;}
  .topbar .title{display:flex;align-items:center;gap:13px;}
  .topbar .logo{width:46px;height:46px;border-radius:13px;background:var(--grad);display:grid;place-items:center;font-size:24px;box-shadow:0 10px 28px -10px var(--accent);}
  .topbar h1{font-size:22px;margin:0;letter-spacing:.5px;display:flex;align-items:center;gap:10px;}
  .badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--grad-soft);color:var(--accent);border:1px solid var(--accent);letter-spacing:0;}
  .topbar .sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .spacer{flex:1;}
  .clock{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);text-align:right;line-height:1.4;}
  .clock b{color:var(--text);font-size:16px;font-weight:700;}
  .controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .icon-btn{
    width:40px;height:40px;border-radius:11px;display:grid;place-items:center;cursor:pointer;
    background:var(--panel);border:1px solid var(--border);color:var(--text);font-size:17px;
    transition:transform .15s, background .2s, border .2s;
  }
  .icon-btn:hover{background:var(--panel-strong);border-color:var(--accent);transform:translateY(-1px);}
  .icon-btn.spin svg{animation:spin .8s linear;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .grid{display:grid;gap:18px;}
  .kpis{grid-template-columns:repeat(6,1fr);}
  .mid{grid-template-columns:1fr; margin-top:18px;}
  .lower{grid-template-columns:1fr 1fr; margin-top:18px;}

  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 20px; box-shadow:var(--shadow); backdrop-filter:blur(14px);
    animation:rise .6s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:none;}}
  .card h3{margin:0 0 14px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;color:var(--text);}
  .card h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--grad);box-shadow:0 0 10px var(--accent);}

  .kpi .label{font-size:13px;color:var(--muted);}
  .kpi .val{font-size:clamp(22px,2.1vw,30px);font-weight:800;margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:.5px;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kpi .unit{font-size:13px;color:var(--muted);font-weight:600;margin-left:4px;-webkit-text-fill-color:var(--muted);}
  .kpi .bar{height:5px;border-radius:5px;background:var(--grad-soft);margin-top:14px;overflow:hidden;}
  .kpi .bar i{display:block;height:100%;width:0;background:var(--grad);border-radius:5px;transition:width 1s cubic-bezier(.16,1,.3,1);}

  .bars{display:flex;flex-direction:column;gap:13px;}
  .bar-row .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;}
  .bar-row .top .nm{color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62%;}
  .bar-row .top .vv{color:var(--muted);font-variant-numeric:tabular-nums;}
  .bar-row .top .vv b{color:var(--accent);}
  .track{height:10px;border-radius:8px;background:var(--panel-strong);overflow:hidden;}
  .track i{display:block;height:100%;width:0;border-radius:8px;background:var(--grad);
    transition:width 1.1s cubic-bezier(.16,1,.3,1);box-shadow:0 0 12px -2px var(--accent);}

  .donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .donut{flex:0 0 150px;width:150px;height:150px;position:relative;}
  .donut .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;}
  .donut .center b{font-size:20px;font-weight:800;}
  .donut .center span{font-size:11px;color:var(--muted);}
  .legend{flex:1;min-width:140px;display:flex;flex-direction:column;gap:9px;}
  .legend .li{display:flex;align-items:center;gap:9px;font-size:13px;}
  .legend .sw{width:11px;height:11px;border-radius:3px;flex:0 0 auto;}
  .legend .li .nm{flex:1;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .legend .li .pc{font-weight:700;font-variant-numeric:tabular-nums;}

  .chart-svg{width:100%;height:240px;display:block;}
  .axis{font-size:10px;fill:var(--muted2);}

  .ministats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .ministat{background:var(--panel-strong);border:1px solid var(--border);border-radius:13px;padding:14px;}
  .ministat .ml{font-size:12px;color:var(--muted);}
  .ministat .mv{font-size:22px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums;}

  .updated{font-size:12px;color:var(--muted2);margin-top:6px;text-align:right;}

  .toast{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
    background:var(--panel-strong);border:1px solid var(--border);color:var(--text);
    padding:12px 22px;border-radius:12px;box-shadow:var(--shadow);z-index:99;
    opacity:0;transition:.35s;backdrop-filter:blur(14px);font-size:14px;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.err{border-color:#ff6b6b;}

  @media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr);}.mid,.lower{grid-template-columns:1fr;}}
  @media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr);}.dash{padding:14px;}.topbar h1{font-size:18px;}}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login" class="login-wrap">
  <div class="login-card">
    <div class="brand">
      <div class="logo">🎫</div>
      <div>
        <h1>西津野渡 · 售票大屏</h1>
        <p>数据看板 · 网页版</p>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" data-pf="0" type="button">管理后台</button>
      <button class="tab" data-pf="2" type="button">综合收银端</button>
    </div>
    <div class="field">
      <label>用户名</label>
      <input id="f-user" type="text" autocomplete="username" placeholder="请输入用户名" />
    </div>
    <div class="field">
      <label>密码</label>
      <input id="f-pass" type="password" autocomplete="current-password" placeholder="请输入密码" />
    </div>
    <label class="remember"><input id="f-rem" type="checkbox" /> 记住我（下次自动登录）</label>
    <button id="login-btn" class="btn">登 录</button>
    <div id="login-err" class="login-err"></div>
    <div class="login-hint">请输入你的账号和密码登录；勾选「记住我」后，下次打开将自动登录，无需重复输入。</div>
  </div>
</div>

<!-- ===================== MERCHANT SELECT ===================== -->
<div id="merchant" class="login-wrap hidden">
  <div class="login-card">
    <div class="brand">
      <div class="logo">🏢</div>
      <div>
        <h1>选择商户</h1>
        <p>该账号下有多个机构</p>
      </div>
    </div>
    <div id="merchant-list" class="merchant-list"></div>
    <div id="merchant-err" class="login-err"></div>
  </div>
</div>

<!-- ===================== DASHBOARD ===================== -->
<div id="app" class="dash hidden">
  <div class="topbar">
    <div class="title">
      <div class="logo">🎫</div>
      <div>
        <h1>西津野渡 · 售票数据大屏 <span class="badge">当日</span></h1>
        <div class="sub" id="org-sub">机构加载中…</div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="controls">
      <div class="icon-btn" id="theme-btn" title="切换主题">🌙</div>
      <div class="icon-btn" id="refresh-btn" title="刷新数据">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </div>
      <div class="icon-btn" id="logout-btn" title="退出登录">⏻</div>
    </div>
  </div>
  <div class="clock">
    <div>服务器时间 <b id="clk">--:--:--</b></div>
    <div class="updated" id="updated">—</div>
  </div>

  <div class="grid kpis" id="kpis" style="margin-top:14px;"></div>

  <div class="grid mid">
    <div class="card">
      <h3><span class="dot"></span>支付方式占比</h3>
      <div class="donut-wrap">
        <div class="donut" id="donut"></div>
        <div class="legend" id="pay-legend"></div>
      </div>
    </div>
  </div>

  <div class="grid lower">
    <div class="card">
      <h3><span class="dot"></span>票种营收排行</h3>
      <div class="bars" id="rev-bars"></div>
    </div>
    <div class="card">
      <h3><span class="dot"></span>销售渠道分布</h3>
      <div class="bars" id="chan-bars"></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
/* ===================== 配置 ===================== */
const LOGIN_API = "https://saas.ip239.com/Api/LoginUser";
const REPORT_API_HTTPS = "https://tour.ip239.com/LargeScreenReport/TicketDataScreenReport";
const REPORT_API_HTTP  = "http://tour.ip239.com/LargeScreenReport/TicketDataScreenReport";
const FALLBACK_ORG = "13276";
const REFRESH_MS = 10000;                                           // 每 10 秒自动刷新
const LS_USER="td_user", LS_PW="td_pw", LS_PF="td_pf", LS_REM="td_rem", LS_ORG="td_org", LS_ORGNAME="td_orgname", LS_THEME="td_theme";
const PALETTE = ["#19e3a5","#28c0ff","#ffd479","#ff7eb6","#a78bfa","#34d399","#f59e0b","#60a5fa","#f472b6","#22d3ee"];

/* ===================== MD5（与 SaaS 登录一致：密码需 MD5 后发送） ===================== */
function md5(string) {
  function rotateLeft(lValue, iShiftBits) { return (lValue << iShiftBits) | (lValue >>> (32 - iShiftBits)); }
  function addUnsigned(lX, lY) {
    var lX4, lY4, lX8, lY8, lResult;
    lX8 = (lX & 0x80000000); lY8 = (lY & 0x80000000);
    lX4 = (lX & 0x40000000); lY4 = (lY & 0x40000000);
    lResult = (lX & 0x3FFFFFFF) + (lY & 0x3FFFFFFF);
    if (lX4 & lY4) return (lResult ^ 0x80000000 ^ lX8 ^ lY8);
    if (lX4 | lY4) { if (lResult & 0x40000000) return (lResult ^ 0xC0000000 ^ lX8 ^ lY8); else return (lResult ^ 0x40000000 ^ lX8 ^ lY8); }
    else return (lResult ^ lX8 ^ lY8);
  }
  function F(x, y, z) { return (x & y) | ((~x) & z); }
  function G(x, y, z) { return (x & z) | (y & (~z)); }
  function H(x, y, z) { return (x ^ y ^ z); }
  function I(x, y, z) { return (y ^ (x | (~z))); }
  function FF(a,b,c,d,x,s,ac){a=addUnsigned(a,addUnsigned(addUnsigned(F(b,c,d),x),ac));return addUnsigned(rotateLeft(a,s),b);}
  function GG(a,b,c,d,x,s,ac){a=addUnsigned(a,addUnsigned(addUnsigned(G(b,c,d),x),ac));return addUnsigned(rotateLeft(a,s),b);}
  function HH(a,b,c,d,x,s,ac){a=addUnsigned(a,addUnsigned(addUnsigned(H(b,c,d),x),ac));return addUnsigned(rotateLeft(a,s),b);}
  function II(a,b,c,d,x,s,ac){a=addUnsigned(a,addUnsigned(addUnsigned(I(b,c,d),x),ac));return addUnsigned(rotateLeft(a,s),b);}
  function convertToWordArray(string) {
    var lWordCount, lMessageLength = string.length;
    var lNumberOfWords_temp1 = lMessageLength + 8;
    var lNumberOfWords_temp2 = (lNumberOfWords_temp1 - (lNumberOfWords_temp1 % 64)) / 64;
    var lNumberOfWords = (lNumberOfWords_temp2 + 1) * 16;
    var lWordArray = Array(lNumberOfWords - 1);
    var lBytePosition = 0, lByteCount = 0;
    while (lByteCount < lMessageLength) {
      lWordCount = (lByteCount - (lByteCount % 4)) / 4;
      lBytePosition = (lByteCount % 4) * 8;
      lWordArray[lWordCount] = (lWordArray[lWordCount] | (string.charCodeAt(lByteCount) << lBytePosition));
      lByteCount++;
    }
    lWordCount = (lByteCount - (lByteCount % 4)) / 4;
    lBytePosition = (lByteCount % 4) * 8;
    lWordArray[lWordCount] = lWordArray[lWordCount] | (0x80 << lBytePosition);
    lWordArray[lNumberOfWords - 2] = lMessageLength << 3;
    lWordArray[lNumberOfWords - 1] = lMessageLength >>> 29;
    return lWordArray;
  }
  function wordToHex(lValue) {
    var WordToHexValue = "", WordToHexValue_temp = "", lByte, lCount;
    for (lCount = 0; lCount <= 3; lCount++) {
      lByte = (lValue >>> (lCount * 8)) & 255;
      WordToHexValue_temp = "0" + lByte.toString(16);
      WordToHexValue = WordToHexValue + WordToHexValue_temp.substr(WordToHexValue_temp.length - 2, 2);
    }
    return WordToHexValue;
  }
  function utf8Encode(string) {
    string = string.replace(/\r\n/g, "\n");
    var utftext = "";
    for (var n = 0; n < string.length; n++) {
      var c = string.charCodeAt(n);
      if (c < 128) utftext += String.fromCharCode(c);
      else if (c > 127 && c < 2048) { utftext += String.fromCharCode((c >> 6) | 192); utftext += String.fromCharCode((c & 63) | 128); }
      else { utftext += String.fromCharCode((c >> 12) | 224); utftext += String.fromCharCode(((c >> 6) & 63) | 128); utftext += String.fromCharCode((c & 63) | 128); }
    }
    return utftext;
  }
  var x = Array(), k, AA, BB, CC, DD, a, b, c, d;
  var S11=7,S12=12,S13=17,S14=22,S21=5,S22=9,S23=14,S24=20,S31=4,S32=11,S33=16,S34=23,S41=6,S42=10,S43=15,S44=21;
  string = utf8Encode(string);
  x = convertToWordArray(string);
  a = 0x67452301; b = 0xEFCDAB89; c = 0x98BADCFE; d = 0x10325476;
  for (k = 0; k < x.length; k += 16) {
    AA = a; BB = b; CC = c; DD = d;
    a=FF(a,b,c,d,x[k+0],S11,0xD76AA478);d=FF(d,a,b,c,x[k+1],S12,0xE8C7B756);c=FF(c,d,a,b,x[k+2],S13,0x242070DB);b=FF(b,c,d,a,x[k+3],S14,0xC1BDCEEE);
    a=FF(a,b,c,d,x[k+4],S11,0xF57C0FAF);d=FF(d,a,b,c,x[k+5],S12,0x4787C62A);c=FF(c,d,a,b,x[k+6],S13,0xA8304613);b=FF(b,c,d,a,x[k+7],S14,0xFD469501);
    a=FF(a,b,c,d,x[k+8],S11,0x698098D8);d=FF(d,a,b,c,x[k+9],S12,0x8B44F7AF);c=FF(c,d,a,b,x[k+10],S13,0xFFFF5BB1);b=FF(b,c,d,a,x[k+11],S14,0x895CD7BE);
    a=FF(a,b,c,d,x[k+12],S11,0x6B901122);d=FF(d,a,b,c,x[k+13],S12,0xFD987193);c=FF(c,d,a,b,x[k+14],S13,0xA679438E);b=FF(b,c,d,a,x[k+15],S14,0x49B40821);

/* ===================== utils ===================== */
const $ = s => document.querySelector(s);
const fmt = (n, d=0) => Number(n||0).toLocaleString("zh-CN",{minimumFractionDigits:d,maximumFractionDigits:d});
// HTML 转义：防止接口返回的数据(如票名)造成 XSS 注入
function esc(s){
  return String(s==null?"":s).replace(/[&<>"'`$]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;","`":"&#96;","$":"&#36;"}[c]));
}
function toast(msg, err=false){
  const t=$("#toast"); t.textContent=msg; t.className="toast show"+(err?" err":"");
  clearTimeout(t._t); t._t=setTimeout(()=>t.className="toast",2600);
}
function animateValue(el, end, {prefix="",dec=0}={}){
  const dur=700, start=performance.now();
  function frame(now){
    let t=Math.min(1,(now-start)/dur); t=1-Math.pow(1-t,3);
    el.textContent=prefix+fmt(end*t,dec);
    if(t<1) requestAnimationFrame(frame); else el.textContent=prefix+fmt(end,dec);
  }
  requestAnimationFrame(frame);
}
// 当日范围：BeginTime/EndTime/TodayBeginTime/TodayEndTime 均取今天
function todayRange(){
  const d=new Date(), y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,"0"), day=String(d.getDate()).padStart(2,"0");
  const s=`${y}-${m}-${day} 00:00:00`, e=`${y}-${m}-${day} 23:59:59`;
  return {s,e};
}

/* ===================== theme ===================== */
function applyTheme(mode){
  const m = mode==="system" ? (matchMedia("(prefers-color-scheme: light)").matches?"light":"dark") : mode;
  document.documentElement.setAttribute("data-theme", m);
  $("#theme-btn").textContent = m==="dark"?"🌙":(mode==="system"?"🌗":"☀️");
}
function cycleTheme(){
  const order=["dark","light","system"];
  const cur=localStorage.getItem(LS_THEME)||"dark";
  const next=order[(order.indexOf(cur)+1)%order.length];
  localStorage.setItem(LS_THEME,next); applyTheme(next);
  toast("主题："+(next==="dark"?"深色":next==="light"?"浅色":"跟随系统"));
}

/* ===================== API ===================== */
async function postJSON(url, body){
  const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok) throw new Error("网络错误 "+r.status);
  return await r.json();
}
// 解析登录响应里的机构(商户)列表，兼容多种字段命名；优先 data 内部
function findOrgList(res){
  const keys=["OrganList","MerchantList","OrgList","OrganArray","MerchantArray","List"];
  let arr=null;
  const scan=o=>{ if(!o) return; for(const k of keys){ if(Array.isArray(o[k])){ arr=o[k]; return true; } } if(Array.isArray(o)){ arr=o; return true; } };
  scan(res && res.data);
  if(!arr) scan(res && res.Data);
  if(!arr) scan(res);
  if(!arr) return [];
  return arr.map(it=>{
    const id = it.OrganId ?? it.MerchantId ?? it.OrganID ?? it.Id ?? it.organId ?? it.id ?? null;
    const name = it.OrganName ?? it.MerchantName ?? it.OrganShortName ?? it.Name ?? it.name ?? null;
    return {id, name};
  }).filter(o=>o.id!=null);
}
async function callReport(url, body){
  const d=await postJSON(url, body);
  if(!d || String(d.resultcode)!=="200") throw new Error((d&&d.resultcontent)||"接口返回异常");
  return d.data;
}
async function fetchReport(token, orgId){
  const {s,e}=todayRange();                       // 仅当日数据
  const body={ OrganId:orgId, BeginTime:s, EndTime:e, TodayBeginTime:s, TodayEndTime:e, Token:token };
  try{ return await callReport(REPORT_API_HTTPS, body); }
  catch(err){ return await callReport(REPORT_API_HTTP, body); }
}

/* ===================== render ===================== */
function renderKPIs(t){
  const items=[
    {k:"InCount",label:"今日入园",unit:"人"},
    {k:"CurrentInCount",label:"当前在场",unit:"人"},
    {k:"SellCount",label:"今日售票",unit:"张"},
    {k:"CheckCount",label:"今日检票",unit:"人"},
    {k:"OutCount",label:"今日出园",unit:"人"},
    {k:"SellAmount",label:"今日销售额",unit:"",money:true},
  ];
  const max=Math.max(...items.map(i=>Number(t[i.k]||0)),1);
  $("#kpis").innerHTML=items.map((i,idx)=>`
    <div class="card kpi" style="animation-delay:${idx*50}ms">
      <div class="label">${i.label}</div>
      <div class="val" data-v="${i.money?Number(t[i.k]||0).toFixed(2):t[i.k]||0}" data-dec="${i.money?2:0}">
        <span class="num">${i.money?"¥":""}0</span><span class="unit">${i.unit}</span>
      </div>
      <div class="bar"><i data-w="${Math.round(Number(t[i.k]||0)/max*100)}"></i></div>
    </div>`).join("");
  $("#kpis").querySelectorAll(".val .num").forEach(el=>{
    const dec=+el.parentElement.dataset.dec;
    animateValue(el, +el.parentElement.dataset.v, {prefix: dec? "¥":"", dec});
  });
  $("#kpis").querySelectorAll(".bar i").forEach(i=>requestAnimationFrame(()=>i.style.width=i.dataset.w+"%"));
}
function renderBars(elId, arr, valKey, {dec=0,prefix=""}={}){
  const max=Math.max(...arr.map(x=>Number(x[valKey]||0)),1);
  $(elId).innerHTML=arr.map(x=>{
    const v=Number(x[valKey]||0);
    return `<div class="bar-row">
      <div class="top"><span class="nm" title="${esc(x.Name)}">${esc(x.Name)}</span>
      <span class="vv"><b>${prefix}${fmt(v,dec)}</b>${x.Count!==undefined&&valKey!=="Count"?` · ${fmt(x.Count)}张`:""}</span></div>
      <div class="track"><i data-w="${Math.round(v/max*100)}"></i></div></div>`;
  }).join("");
  $(elId).querySelectorAll(".track i").forEach(i=>requestAnimationFrame(()=>i.style.width=i.dataset.w+"%"));
}
function renderDonut(elId, legendId, arr, valKey){
  const total=arr.reduce((s,x)=>s+Number(x[valKey]||0),0)||1;
  const R=60, C=2*Math.PI*R, cx=75, cy=75;
  let off=0, segs="";
  arr.forEach((x,i)=>{
    const frac=Number(x[valKey]||0)/total, len=frac*C;
    segs+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${PALETTE[i%PALETTE.length]}" stroke-width="16"
      stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 ${cx} ${cy})"
      style="transition:stroke-dasharray 1s cubic-bezier(.16,1,.3,1)"/>`;
    off+=len;
  });
  $(elId).innerHTML=`<svg viewBox="0 0 150 150" width="150" height="150">
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--panel-strong)" stroke-width="16"/>
    ${segs}
    <text x="75" y="70" text-anchor="middle" fill="var(--text)" font-size="20" font-weight="800">${fmt(total)}</text>
    <text x="75" y="90" text-anchor="middle" fill="var(--muted)" font-size="11">总额</text></svg>`;
  $(legendId).innerHTML=arr.map((x,i)=>{
    const pc=(Number(x[valKey]||0)/total*100).toFixed(1);
    return `<div class="li"><span class="sw" style="background:${PALETTE[i%PALETTE.length]}"></span>
      <span class="nm" title="${esc(x.Name)}">${esc(x.Name)}</span><span class="pc">${pc}%</span></div>`;
  }).join("");
}

/* ===================== data load ===================== */
let refreshTimer=null, clockTimer=null, loading=false;
async function load(){
  const token=localStorage.getItem("td_token");
  const orgId=localStorage.getItem(LS_ORG);
  if(!token||!orgId){ showLogin(); return; }
  if(loading) return; loading=true;
  try{
    const d=await fetchReport(token, orgId);          // 仅当日数据
    renderKPIs(d.Today||{});
    renderBars("#rev-bars", d.TicketRevenueArray||[], "Amount", {dec:2,prefix:"¥"});
    renderBars("#chan-bars", d.ChannelArray||[], "Amount", {dec:2,prefix:"¥"});
    renderDonut("#donut","#pay-legend", d.PayTypeArray||[], "Amount");
    $("#updated").textContent="最后更新 "+new Date().toLocaleTimeString("zh-CN");
    startClock(d.ServerTime);
    $("#refresh-btn").classList.remove("spin");
  }catch(e){
    $("#refresh-btn").classList.remove("spin");
    if(/token|登录|授权|失效|过期|auth/i.test(e.message)){
      toast("登录已失效，请重新登录", true);
      setTimeout(showLogin, 1200);
    } else {
      toast("数据加载失败："+e.message, true);
    }
  }finally{ loading=false; }
}
function startClock(serverTime){
  let base=serverTime? new Date(serverTime.replace(/-/g,"/")) : new Date();
  const boot=Date.now();
  clearInterval(clockTimer);
  clockTimer=setInterval(()=>{
    const t=new Date(base.getTime()+(Date.now()-boot));
    $("#clk").textContent=t.toLocaleTimeString("zh-CN",{hour12:false});
  },1000);
}
function scheduleAuto(){
  clearInterval(refreshTimer);
  refreshTimer=setInterval(()=>{ if(!$("#app").classList.contains("hidden")) load(); }, REFRESH_MS);
}

/* ===================== login flow（账号 + 密码，与 saas.ip239.com 一致） ===================== */
let loginPlatform="0";
function showLogin(){
  clearInterval(refreshTimer); clearInterval(clockTimer);
  $("#app").classList.add("hidden");
  $("#merchant").classList.add("hidden");
  $("#login").classList.remove("hidden");
  $("#login-err").textContent="";
}
function showMerchant(list, token, user, pwMd5, rem){
  $("#login").classList.add("hidden");
  $("#app").classList.add("hidden");
  $("#merchant").classList.remove("hidden");
  $("#merchant-err").textContent="";
  $("#merchant-list").innerHTML=list.map((o,i)=>
    `<button class="m" data-i="${i}">${esc(o.name||("机构 "+o.id))}<small>机构ID ${esc(o.id)}</small></button>`).join("");
  $("#merchant-list").querySelectorAll(".m").forEach(btn=>{
    btn.onclick=()=>{
      const o=list[+btn.dataset.i];
      localStorage.setItem(LS_ORG, o.id);
      localStorage.setItem(LS_ORGNAME, o.name||"");
      finishLogin(token, o.id, o.name||"");
    };
  });
}
async function loginWith(user, pwMd5, rem){
  const btn=$("#login-btn"); btn.disabled=true; btn.textContent="登录中…"; $("#login-err").textContent="";
  try{
    const body={ UserName:user, PassWord:pwMd5, PlatformType:0, OrganId: localStorage.getItem(user+":OrganId")||null };
    const res=await postJSON(LOGIN_API, body);
    // 成功判定：拿到令牌即可（令牌在 res.data.Token，兼容顶层 Token）
    const token = (res && res.data && res.data.Token) || (res && res.Token) || null;
    if(!token){
      const msg=(res&&(res.resultcontent||res.message))||"登录失败（未返回令牌）";
      const diag=res?("\n服务端返回："+JSON.stringify(res).slice(0,400)):"";
      $("#login-err").textContent=msg+diag;
      return;
    }
    if(rem){ localStorage.setItem(LS_USER,user); localStorage.setItem(LS_PW,pwMd5); localStorage.setItem(LS_PF,loginPlatform); localStorage.setItem(LS_REM,"1"); }
    else { localStorage.removeItem(LS_USER); localStorage.removeItem(LS_PW); localStorage.removeItem(LS_PF); localStorage.removeItem(LS_REM); }
    const orgs=findOrgList(res);
    if(orgs.length>1){ showMerchant(orgs, token, user, pwMd5, rem); }
    else {
      const orgId = orgs.length===1 ? orgs[0].id : FALLBACK_ORG;
      const orgName = orgs.length===1 ? (orgs[0].name||"") : "";
      localStorage.setItem(LS_ORG, orgId);
      localStorage.setItem(LS_ORGNAME, orgName);
      finishLogin(token, orgId, orgName);
    }
  }catch(e){
    $("#login-err").textContent="登录失败："+(e.message||e);
  }finally{
    btn.disabled=false; btn.textContent="登 录";
  }
}
function finishLogin(token, orgId, orgName){
  localStorage.setItem("td_token", token);
  $("#login").classList.add("hidden");
  $("#merchant").classList.add("hidden");
  $("#app").classList.remove("hidden");
  $("#org-sub").textContent=(orgName?orgName+" · ":"")+"机构ID "+orgId+" · 当日数据（每 10 秒刷新）";
  toast("登录成功");
  load(); scheduleAuto();
}
function doLogin(){
  const user=$("#f-user").value.trim();
  const pass=$("#f-pass").value;
  const rem=$("#f-rem").checked;
  if(!user){ $("#login-err").textContent="请输入用户名"; return; }
  if(!pass){ $("#login-err").textContent="请输入密码"; return; }
  loginWith(user, md5(pass), rem);
}
function logout(){
  localStorage.removeItem("td_token"); localStorage.removeItem(LS_ORG); localStorage.removeItem(LS_ORGNAME);
  showLogin();
}

/* ===================== boot ===================== */
function boot(){
  applyTheme(localStorage.getItem(LS_THEME)||"dark");
  $("#theme-btn").onclick=cycleTheme;
  $("#refresh-btn").onclick=()=>{ $("#refresh-btn").classList.add("spin"); load(); };
  $("#logout-btn").onclick=logout;
  document.querySelectorAll(".tabs .tab").forEach(t=>t.onclick=()=>{
    document.querySelectorAll(".tabs .tab").forEach(x=>x.classList.remove("active"));
    t.classList.add("active"); loginPlatform=t.dataset.pf;
  });
  $("#login-btn").onclick=doLogin;
  $("#f-pass").addEventListener("keydown",e=>{ if(e.key==="Enter") doLogin(); });
  $("#f-user").addEventListener("keydown",e=>{ if(e.key==="Enter") doLogin(); });
  // 记住我 → 下次打开自动登录
  if(localStorage.getItem(LS_REM)==="1" && localStorage.getItem(LS_USER) && localStorage.getItem(LS_PW)){
    loginPlatform=localStorage.getItem(LS_PF)||"0";
    loginWith(localStorage.getItem(LS_USER), localStorage.getItem(LS_PW), true);
  } else {
    showLogin();
  }
}
boot();
